upstream learning_api {
    server api-a:8080 max_fails=1 fail_timeout=5s;
    server api-b:8080 max_fails=1 fail_timeout=5s;
    keepalive 16;
}
upstream media_delivery {
    server media:8080;
}
server {
    listen 80;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 1s;
    proxy_read_timeout 3s;

    location ~ ^/api/v1/schools/[^/]+/media/ {
        access_log off;
        proxy_pass http://media_delivery;
    }
    location / {
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_pass http://learning_api;
    }
}
