<style>
:root{--bg:#f4f7fb;--panel:#fff;--text:#183047;--muted:#516477;--brand:#17616a;--border:#cbd7e2;--accent:#e7f4f3;--danger:#a62032}

main{padding:25px;min-width:0;width:100%;max-width:1350px;margin-inline:auto}.panel,.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}.card{margin:0}.card h3{margin-top:0}.card p{color:var(--muted)}body[data-experience="learning"] .card{border-radius:22px;box-shadow:0 8px 22px #1446460c}body[data-experience="formal"] .panel,body[data-experience="formal"] .card{border-radius:9px}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.btn{background:var(--brand);color:#fff;border:1px solid transparent;border-radius:9px;padding:8px 15px}.ghost{background:var(--accent);color:var(--text);border-color:var(--border)}.danger{color:var(--danger)}.controls .btn{margin-block:3px}
input,select,textarea{border:1px solid var(--border);border-radius:9px;padding:9px;background:var(--panel);color:var(--text);max-width:100%}input[type=radio],input[type=checkbox]{min-height:24px;width:24px;vertical-align:middle;accent-color:var(--brand)}textarea{width:100%;resize:vertical}label{display:block;margin:8px 0 4px}fieldset{min-width:0;border:1px solid var(--border);border-radius:10px;padding:16px;margin-block:12px}legend{padding-inline:6px;font-weight:bold}
.table-wrap{overflow:auto;max-width:100%}table{width:100%;min-width:580px;border-collapse:collapse}caption{text-align:start;color:var(--muted);padding-bottom:10px}th{white-space:nowrap}th,td{border-bottom:1px solid var(--border);padding:12px;text-align:start}td .controls{min-width:210px}.pill{display:inline-block;white-space:nowrap;background:var(--accent);padding:3px 10px;border-radius:24px}.progress{height:12px;background:var(--border);border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:#19866e}
video{display:block;width:100%;max-height:480px;background:#101c28;border-radius:12px;margin-block:14px}#checkpoint{border:2px solid var(--brand)}#toast{position:fixed;bottom:18px;inset-inline-end:18px;max-width:calc(100% - 36px);background:var(--text);color:var(--panel);padding:12px 18px;border-radius:10px;z-index:5}#toast:empty{display:none}.error{color:var(--danger)}#storageWarning{background:var(--accent);border-bottom:1px solid var(--border);padding:12px 24px}footer{padding:16px 25px;color:var(--muted);font-size:.85rem}

<header><div><h1>◆ منصة الماس للتعليم الإلكتروني</h1><div class="small">نموذج تفاعلي — بيانات تجريبية محلية فقط</div></div><div class="controls"><label for="role">الدور التجريبي</label><select id="role"><option value="student">الطالب</option><option value="teacher">المعلم</option><option value="parent">ولي الأمر</option><option value="admin">الإدارة</option></select><button type="button" class="btn ghost" id="theme" aria-pressed="false">◐ المظهر</button><button type="button" class="btn ghost" data-action="welcome">البداية</button></div></header>

<div class="layout"><aside><nav id="nav" aria-label="القائمة الرئيسية"></nav></aside><main id="main" tabindex="-1"><div id="content"></div></main></div>
<footer>نسخة قبول تجريبية للمرحلة الأولى. لا يوجد خادم أو مصادقة أو دفع حقيقي. استخدم أسماء وبيانات وهمية فقط.</footer>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dialog" aria-labelledby="dialogTitle"></dialog>
<script>
"use strict";
// REPOSITORY START
class MockRepository {
  #data;
  #storage = null;
  #sequence = 0;
  #key = 'almas-demo-v1';
  storageWarning = '';

  constructor() {
    this.#data = this.#seed();
    try {
      this.#storage = globalThis.localStorage;
      if (!this.#storage) throw new Error('Storage unavailable');
      const saved = this.#storage.getItem(this.#key);
      if (saved !== null) {
        const parsed = JSON.parse(saved);
        this.#validateState(parsed);
        this.#data = parsed;
      } else this.#persist();
    } catch (_) {
      this.#storage = null;
      this.storageWarning = 'تعذر قراءة التخزين المحلي أو كانت بياناته تالفة. التغييرات محفوظة لهذه الجلسة فقط.';
    }
  }

  #seed() {
    const checkpoint = () => ({ text: 'ما الغاز الذي يمتصه النبات في البناء الضوئي؟', options: ['ثاني أكسيد الكربون', 'الأكسجين', 'النيتروجين'], correct: 0 });
    const generic = (id, name, detail, status = 'نشط') => ({ id, name, detail, status });
    return {
      version: 1,
      collections: {
        subjects: [
          { ...generic('s1', 'الأحياء', 'الخلية والبناء الضوئي'), teacher: 'الأستاذ زيد' },
          { ...generic('s2', 'الكيمياء', 'العناصر والروابط الكيميائية'), teacher: 'الأستاذة مريم' },
          { ...generic('s3', 'الفيزياء', 'الحركة والطاقة'), teacher: 'الأستاذ أحمد' },
          { ...generic('s4', 'الرياضيات', 'المعادلات والدوال'), teacher: 'الأستاذة نور' }
        ],
        lessons: [
          { ...generic('l1', 'الأوراق والبناء الضوئي', 'تعرف إلى دور الأوراق في صنع الغذاء'), subjectId: 's1', duration: '18 دقيقة', checkpoint: checkpoint() },
          { ...generic('l2', 'البناء الكيميائي', 'مصادر الطاقة في الكائنات الحية'), subjectId: 's1', duration: '14 دقيقة', checkpoint: { text: 'ما مصدر الطاقة في البناء الكيميائي؟', options: ['تفاعلات كيميائية', 'الضوء', 'الرياح'], correct: 0 } },
          { ...generic('l3', 'الروابط الكيميائية', 'مقدمة عن ترابط الذرات'), subjectId: 's2', duration: '22 دقيقة', checkpoint: { text: 'ما الذي يربط الذرات؟', options: ['روابط كيميائية', 'الجاذبية فقط', 'الضوء'], correct: 0 } },
          { ...generic('l4', 'قوانين الحركة', 'القوة والكتلة والتسارع'), subjectId: 's3', duration: '19 دقيقة', checkpoint: { text: 'بماذا يقاس مقدار القوة؟', options: ['نيوتن', 'متر', 'ثانية'], correct: 0 } }
        ],
        exams: [{ ...generic('e1', 'اختبار الأحياء التجريبي', 'ثلاثة أسئلة عن البناء الضوئي'), subjectId: 's1', studentIds: ['u1'], duration: 300, questions: [
          { id: 'q1', text: 'أين تحدث عملية البناء الضوئي؟', options: ['البلاستيدة الخضراء', 'النواة', 'الميتوكوندريا'], correct: 0 },
          { id: 'q2', text: 'ما الغاز الذي يمتصه النبات؟', options: ['الأكسجين', 'ثاني أكسيد الكربون', 'النيتروجين'], correct: 1 },
          { id: 'q3', text: 'ما مصدر الطاقة في البناء الضوئي؟', options: ['الشمس', 'الرياح', 'التربة'], correct: 0 }
        ] }],
        assignments: [
          { ...generic('a1', 'واجب الأحياء', 'اشرح دور الأوراق في البناء الضوئي في فقرة قصيرة.', 'مطلوب'), subjectId: 's1', studentIds: ['u1'] },
          { ...generic('a2', 'واجب الكيمياء', 'اكتب ملخصاً عن الروابط الكيميائية.', 'قيد المراجعة'), subjectId: 's2', studentIds: ['u4'] }
        ],
        students: [
          { id: 'u1', name: 'علي حسن', grade: 91, progress: 88 },
          { id: 'u2', name: 'فاطمة كريم', grade: 86, progress: 79 },
          { id: 'u3', name: 'محمد أحمد', grade: 74, progress: 62 },
          { id: 'u4', name: 'سارة حسن', grade: 83, progress: 72 }
        ],
        children: [
          { id: 'c1', name: 'علي حسن', grade: 'الخامس العلمي', progress: 88, studentId: 'u1' },
          { id: 'c2', name: 'سارة حسن', grade: 'الثالث المتوسط', progress: 72, studentId: 'u4' }
        ],
        attendance: [
          { id: 'at1', name: 'حصة الأحياء', childId: 'c1', status: 'حاضر' },
          { id: 'at2', name: 'حصة الكيمياء', childId: 'c1', status: 'حاضر' },
          { id: 'at3', name: 'حصة الرياضيات', childId: 'c2', status: 'غائب' },
          { id: 'at4', name: 'حصة العلوم', childId: 'c2', status: 'حاضر' }
        ],
        users: [generic('user1', 'مستخدم طالب تجريبي', 'دور الطالب'), generic('user2', 'مستخدم معلم تجريبي', 'دور المعلم')],
        schools: [generic('school1', 'مدرسة الماس التجريبية', 'مدرسة افتراضية لعرض الواجهة')],
        classes: [generic('class1', 'الخامس العلمي', 'شعبة تعليمية تجريبية'), generic('class2', 'الثالث المتوسط', 'شعبة تعليمية تجريبية')],
        subscriptions: [generic('sub1', 'الخطة التعليمية الشهرية', 'اشتراك محلي توضيحي دون فوترة', 'فعال')],
        payments: [generic('pay1', 'سجل دفع تجريبي', 'محاكاة دون عملية مالية أو بيانات بطاقة', 'مكتمل')],
        providers: [generic('provider1', 'مزود تعليمي تجريبي', 'توصيات محلية دون اتصال بخدمة خارجية')],
        permissions: [generic('permission1', 'صلاحيات الطالب', 'عرض المواد والدروس'), generic('permission2', 'صلاحيات المعلم', 'إدارة المحتوى التجريبي')],
        messages: [
          { ...generic('m1', 'إدارة المنصة', 'مرحباً بكم في النسخة التجريبية.', 'مقروء'), role: 'all' },
          { ...generic('m2', 'معلم الأحياء', 'يرجى مراجعة الدرس قبل الاختبار.', 'جديد'), role: 'student' }
        ],
        notifications: [
          { ...generic('n1', 'درس جديد', 'تمت إضافة درس البناء الضوئي.', 'جديد'), role: 'all' },
          { ...generic('n2', 'اختبار متاح', 'اختبار الأحياء التجريبي متاح الآن.', 'جديد'), role: 'all' }
        ],
        audit: [generic('audit1', 'تهيئة العرض التجريبي', 'بيانات افتراضية توضيحية دون حسابات حقيقية.', 'مكتمل')]
      },
      settings: { selectedChild: 'c1' },
      lessonStates: {},
      attempts: {}
    };
  }

  #clone(value) { return value === undefined ? undefined : JSON.parse(JSON.stringify(value)); }
  #object(value) { return value !== null && Object.prototype.toString.call(value) === '[object Object]'; }
  #safeKey(key) { return typeof key === 'string' && key.length > 0 && key.length <= 120 && !['__proto__', 'prototype', 'constructor'].includes(key); }
  #assert(condition, message) { if (!condition) throw new Error(message); }
  #json(value, seen = new Set(), depth = 0) {
    this.#assert(depth < 30, 'بيانات متداخلة أكثر من المسموح.');
    if (value === null || typeof value === 'boolean' || typeof value === 'string') return;
    if (typeof value === 'number') { this.#assert(Number.isFinite(value), 'قيمة عددية غير صالحة.'); return; }
    this.#assert(Array.isArray(value) || this.#object(value), 'قيمة البيانات غير صالحة.');
    this.#assert(!seen.has(value), 'بيانات دائرية غير صالحة.');
    seen.add(value);
    for (const [key, item] of Object.entries(value)) {
      this.#assert(this.#safeKey(key), 'مفتاح بيانات غير صالح.');
      this.#json(item, seen, depth + 1);
    }
    seen.delete(value);
  }
  #text(value, label, limit, required = true) {
    this.#assert(typeof value === 'string' && (!required || value.trim().length > 0) && value.length <= limit, label + ' مطلوب وبحد أقصى ' + limit + ' حرفاً.');
  }
  #range(value, max, label) { this.#assert(typeof value === 'number' && Number.isFinite(value) && value >= 0 && value <= max, label + ' يجب أن يكون بين 0 و' + max + '.'); }
  #timestamp(value) { this.#assert(Number.isSafeInteger(value) && value >= 0 && value <= 8640000000000000, 'وقت المحاولة غير صالح.'); }
  #collection(kind) { this.#assert(Object.hasOwn(this.#data.collections, kind), 'نوع المجموعة غير معروف.'); return this.#data.collections[kind]; }
  #exists(kind, id) { this.#assert(this.#safeKey(id), 'معرّف غير صالح.'); const record = this.#collection(kind).find(item => item.id === id); this.#assert(record, 'العنصر المطلوب غير موجود.'); return record; }
  #question(question, needsId) {
    this.#assert(this.#object(question), 'صيغة السؤال غير صالحة.');
    if (needsId) this.#assert(this.#safeKey(question.id), 'معرّف السؤال غير صالح.');
    this.#text(question.text, 'نص السؤال', 2000);
    this.#assert(Array.isArray(question.options) && question.options.length >= 2 && question.options.length <= 6, 'السؤال يحتاج خيارين إلى ستة خيارات.');
    question.options.forEach(option => this.#text(option, 'خيار السؤال', 500));
    this.#assert(Number.isInteger(question.correct) && question.correct >= 0 && question.correct < question.options.length, 'خيار الإجابة الصحيحة غير صالح.');
  }
  #record(kind, record, data = this.#data) {
    this.#assert(this.#object(record) && this.#safeKey(record.id), 'معرّف السجل غير صالح.');
    this.#text(record.name, 'الاسم', 120);
    if (record.detail !== undefined) this.#text(record.detail, 'التفاصيل', 2000, false);
    if (record.status !== undefined) this.#text(record.status, 'الحالة', 120);
    if (record.submission !== undefined) this.#text(record.submission, 'نص التسليم', 5000, false);
    if (record.teacher !== undefined) this.#text(record.teacher, 'اسم المعلم', 120, false);
    if (['lessons', 'exams', 'assignments'].includes(kind)) this.#assert(typeof record.subjectId === 'string' && data.collections.subjects.some(subject => subject.id === record.subjectId), 'المادة المرتبطة غير موجودة.');
    if (['exams', 'assignments'].includes(kind) && record.studentIds !== undefined) {
      this.#assert(Array.isArray(record.studentIds) && record.studentIds.every(id => this.#safeKey(id) && data.collections.students.some(student => student.id === id)), 'قائمة الطلاب تحتوي معرّف طالب غير صالح أو غير موجود.');
      this.#assert(new Set(record.studentIds).size === record.studentIds.length, 'قائمة الطلاب تحتوي معرّفات مكررة.');
    }
    if (kind === 'assignments' && record.submissions !== undefined) {
      this.#assert(this.#object(record.submissions), 'صيغة تسليمات الواجب غير صالحة.');
      for (const [studentId, answer] of Object.entries(record.submissions)) {
        this.#assert(this.#safeKey(studentId) && data.collections.students.some(student => student.id === studentId), 'تسليم الواجب مرتبط بطالب غير موجود.');
        this.#text(answer, 'إجابة تسليم الواجب', 5000);
      }
    }
    if (kind === 'lessons') { this.#text(record.duration, 'مدة الدرس', 40); this.#question(record.checkpoint, false); }
    if (kind === 'exams') {
      this.#assert(Number.isInteger(record.duration) && record.duration >= 1 && record.duration <= 10800, 'مدة الاختبار يجب أن تكون بين ثانية و180 دقيقة.');
      this.#assert(Array.isArray(record.questions) && record.questions.length > 0 && record.questions.length <= 100, 'الاختبار يحتاج أسئلة صالحة.');
      record.questions.forEach(question => this.#question(question, true));
      this.#assert(new Set(record.questions.map(question => question.id)).size === record.questions.length, 'معرّفات أسئلة الاختبار مكررة.');
    }
    if (kind === 'students') { this.#range(record.grade, 100, 'الدرجة'); this.#range(record.progress, 100, 'نسبة التقدم'); }
    if (kind === 'children') { this.#text(record.grade, 'الصف', 120); this.#range(record.progress, 100, 'نسبة التقدم'); this.#assert(typeof record.studentId === 'string' && data.collections.students.some(student => student.id === record.studentId), 'الطالب المرتبط غير موجود.'); }
    if (kind === 'attendance') this.#assert(typeof record.childId === 'string' && data.collections.children.some(child => child.id === record.childId), 'الابن المرتبط غير موجود.');
    if (record.role !== undefined) this.#assert(['all', 'student', 'teacher', 'parent', 'admin'].includes(record.role), 'الدور غير صالح.');
    if (record.at !== undefined) this.#timestamp(record.at);
  }
  #lessonState(value) {
    this.#assert(this.#object(value), 'بيانات تقدم الدرس غير صالحة.');
    this.#range(value.percent, 100, 'نسبة التقدم');
    this.#range(value.seconds, 8640000, 'الوقت بالثواني');
    this.#text(value.notes, 'الملاحظات', 10000, false);
    if (value.bookmark !== null) this.#assert(typeof value.bookmark === 'number' && Number.isFinite(value.bookmark) && value.bookmark >= 0 && value.bookmark <= 8640000, 'وقت العلامة المرجعية غير صالح.');
    this.#assert(typeof value.checkpointAnswered === 'boolean', 'حالة السؤال غير صالحة.');
  }
  #attempt(examId, value, data = this.#data) {
    this.#assert(this.#object(value) && value.examId === examId && ['active', 'submitted'].includes(value.status), 'بيانات محاولة الاختبار غير صالحة.');
    this.#timestamp(value.deadline);
    this.#assert(this.#object(value.answers) && Array.isArray(value.review) && Number.isInteger(value.current) && value.current >= 0, 'بيانات إجابات المحاولة غير صالحة.');
    const exam = data.collections.exams.find(item => item.id === examId);
    for (const [id, answer] of Object.entries(value.answers)) {
      const question = exam && exam.questions.find(item => item.id === id);
      this.#assert(this.#safeKey(id) && Number.isInteger(answer) && answer >= 0 && (!exam || (question && answer < question.options.length)), 'إجابة السؤال أو خيارها غير صالح.');
    }
    this.#assert(value.review.every(id => this.#safeKey(id) && (!exam || exam.questions.some(question => question.id === id))) && new Set(value.review).size === value.review.length, 'أسئلة المراجعة غير صالحة.');
    if (exam) this.#assert(value.current < exam.questions.length, 'رقم السؤال الحالي غير صالح.');
    if (value.status === 'submitted') {
      this.#timestamp(value.submittedAt);

  return '<fieldset class="question-editor" data-qid="'+esc(question?.id||'q-'+Date.now()+'-'+Math.random().toString(36).slice(2))+'"><legend>'+(prefix==='cp'?'سؤال التوقف عند منتصف الفيديو':'سؤال '+(index+1))+'</legend>'+field(id+'text','السؤال',question?.text||'','text','required maxlength="2000"')+['الأول','الثاني','الثالث'].map((name,n)=>field(id+'o'+n,'الخيار '+name,question?.options[n]||'','text','required maxlength="500"')).join('')+'<label for="'+id+'correct">الإجابة الصحيحة</label><select id="'+id+'correct">'+['الأول','الثاني','الثالث'].map((name,n)=>'<option value="'+n+'" '+(question?.correct===n?'selected':'')+'>'+name+'</option>').join('')+'</select>'+(prefix==='q'?button('حذف السؤال','removeQuestion'):'')+'</fieldset>';
}
function readQuestion(node,index,prefix='q') {const id=prefix+index;return {id:node.dataset.qid,text:el(id+'text').value.trim(),options:[0,1,2].map(n=>el(id+'o'+n).value.trim()),correct:Number(el(id+'correct').value)};}
function editRecord(id) {
  const kind=pageKind(),record=id?repository.get(kind,id):null;
  if(!manager()||kind==='audit')return;
  const subjects=repository.list('subjects');
  const status=record?.status||'نشط';
  let body=field('recordName','الاسم',record?.name||'','text','required maxlength="120" autofocus')+'<label for="recordDetail">التفاصيل</label><textarea id="recordDetail" maxlength="2000">'+esc(record?.detail||'')+'</textarea>'+field('recordStatus','الحالة',status,'text','required maxlength="120"');
  if(kind==='subjects')body+=field('recordTeacher','المعلم',record?.teacher||'','text','maxlength="120"');
  if(['lessons','exams','assignments'].includes(kind))body+='<label for="recordSubject">المادة</label><select id="recordSubject" required>'+subjects.map(s=>'<option value="'+esc(s.id)+'" '+(record?.subjectId===s.id?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select>';
  if(kind==='lessons')body+=field('recordDuration','مدة الدرس',record?.duration||'10 دقائق','text','required maxlength="40"')+optionFields(record?.checkpoint,0,'cp');
  if(kind==='exams')body+=field('recordDuration','المدة بالدقائق',(record?.duration||300)/60,'number','required min="1" max="180" step="1"')+'<div id="questionEditors">'+(record?.questions||[null]).map((q,i)=>optionFields(q,i)).join('')+'</div>'+button('إضافة سؤال','addQuestion');
  if(['exams','assignments'].includes(kind))body+='<fieldset><legend>الطلاب المشمولون</legend>'+repository.list('students').map(s=>'<label><input type="checkbox" name="audience" value="'+esc(s.id)+'" '+(!record?.studentIds||record.studentIds.includes(s.id)?'checked':'')+'> '+esc(s.name)+'</label>').join('')+'</fieldset>';
  if(kind==='students')body+=field('recordGrade','الدرجة',record?.grade||0,'number','required min="0" max="100"')+field('recordProgress','التقدم',record?.progress||0,'number','required min="0" max="100"');
  body+='<p class="controls"><button class="btn" type="submit">حفظ</button>'+button('إلغاء','closeDialog')+'</p>';
  showDialog(id?'تعديل سجل':'إضافة سجل',body,()=>{
    const updated={...(record||{}),name:el('recordName').value.trim(),detail:el('recordDetail').value.trim(),status:el('recordStatus').value.trim()};
    if(kind==='subjects')updated.teacher=el('recordTeacher').value.trim();
    if(el('recordSubject'))updated.subjectId=el('recordSubject').value;
    if(kind==='lessons'){updated.duration=el('recordDuration').value.trim();updated.checkpoint=readQuestion(el('dialog').querySelector('.question-editor'),0,'cp');delete updated.checkpoint.id;}
    if(kind==='exams'){updated.duration=Number(el('recordDuration').value)*60;updated.questions=[...el('questionEditors').children].map((node,i)=>readQuestion(node,i));}
    if(['exams','assignments'].includes(kind))updated.studentIds=[...el('dialog').querySelectorAll('[name="audience"]:checked')].map(input=>input.value);
    if(kind==='students'){updated.grade=Number(el('recordGrade').value);updated.progress=Number(el('recordProgress').value);}
    repository.save(kind,updated);el('dialog').close();render();notify('تم حفظ السجل محلياً');
  });
}

function videoPage() {
  const lessons=repository.list('lessons');if(!lessons.length)return section('مشغل الفيديو التفاعلي','<p>لا توجد دروس. أضف درساً من دور المعلم.</p>');

ength="10000">'+esc(data.notes)+'</textarea><p>'+button('حفظ الملاحظات','saveNotes')+'</p>');
}
function updateVideoUI() {
  const data=videoState();el('videoPercent').textContent=data.percent+'%';el('videoProgress').setAttribute('aria-valuenow',data.percent);el('videoProgress').firstElementChild.style.width=data.percent+'%';
  el('bookmarkStatus').textContent=data.bookmark===null?'لا توجد علامة مرجعية.':'علامة مرجعية عند '+Math.floor(data.bookmark)+' ثانية.';
  el('checkpoint').hidden=data.checkpointAnswered||data.percent<50;storageNotice();
}
function checkVideoProgress(percent,seconds) {
  const data=videoState(),video=el('lessonVideo');
  const blocked=percent>=50&&!data.checkpointAnswered;
  if(blocked) {video.pause();percent=50;if(Number.isFinite(video.duration)&&seconds>video.duration/2){seconds=video.duration/2;video.currentTime=seconds;}}
  const wasHidden=el('checkpoint').hidden;
  saveVideoState({percent:Math.max(0,Math.min(100,Math.floor(percent))),seconds:Math.max(0,seconds)});updateVideoUI();
  if(blocked&&wasHidden)el('checkpointTitle').focus();
}
function bindVideo() {
  const video=el('lessonVideo'),file=videoFiles.get(state.lessonId);
  const current=()=>video.isConnected&&el('lessonVideo')===video;
  video.addEventListener('loadedmetadata',()=>{if(!current())return;const data=videoState();video.currentTime=Math.min(data.seconds,Number.isFinite(video.duration)?video.duration:0);el('mediaStatus').textContent='الفيديو المحلي جاهز؛ استُعيد موضع المشاهدة.';});
  video.addEventListener('timeupdate',()=>{if(current()&&Number.isFinite(video.duration)&&video.duration>0)checkVideoProgress(video.currentTime/video.duration*100,video.currentTime);});
  video.addEventListener('play',()=>{if(!current())return;const d=videoState();if(!d.checkpointAnswered&&d.percent>=50)video.pause();});
  video.addEventListener('error',()=>{if(current())el('mediaStatus').textContent='تعذر تشغيل هذا الترميز. اختر فيديو آخر أو استخدم المحاكاة.';});
  video.addEventListener('waiting',()=>{if(current())el('mediaStatus').textContent='جارٍ تحميل الفيديو المحلي…';});
  video.addEventListener('canplay',()=>{if(current())el('mediaStatus').textContent='الفيديو المحلي جاهز للتشغيل.';});
  if(file)video.src=file.url;
  updateVideoUI();
}

function tickExam() {
  if(!el('examTimer'))return;
  const attempt=repository.getAttempt(state.examId);if(!attempt)return;
  if(attempt.status==='submitted'){if(el('dialog').open)el('dialog').close();render();notify('انتهى وقت الاختبار؛ تم حفظ النتيجة.');return;}
  const seconds=Math.max(0,Math.ceil((attempt.deadline-Date.now())/1000));el('examTimer').textContent='الوقت المتبقي: '+String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
}

  el('nav').innerHTML=entering?'':menus[state.role].map(([id,label])=>'<button type="button" data-page="'+id+'" class="'+(state.page===id?'active':'')+'" '+(state.page===id?'aria-current="page"':'')+'>'+esc(label)+'</button>').join('');
  el('content').setAttribute('aria-busy','true');

  checkpoint:id=>{const lesson=repository.get('lessons',state.lessonId);if(Number(id)!==lesson.checkpoint.correct){el('checkpointError').textContent='إجابة غير صحيحة؛ حاول مرة أخرى.';return;}saveVideoState({checkpointAnswered:true});updateVideoUI();notify('إجابة صحيحة؛ يمكنك متابعة الدرس');if(el('lessonVideo').currentSrc)el('lessonVideo').play().catch(()=>notify('اضغط تشغيل لمتابعة الفيديو'));else el('notes').focus();},
  fullscreen:async()=>{try{const v=el('lessonVideo');if(v.requestFullscreen)await v.requestFullscreen();else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen();else notify('استخدم زر ملء الشاشة في أدوات المتصفح');}catch{notify('استخدم زر ملء الشاشة في أدوات الفيديو');}},
  assignment:id=>{const a=repository.get('assignments',id);showDialog(a.name,'<p>'+esc(a.detail)+'</p><label for="submission">إجابتي التجريبية</label><textarea id="submission" rows="4" required maxlength="5000">'+esc(assignmentSubmission(a,'u1'))+'</textarea><p class="controls"><button class="btn" type="submit">حفظ التسليم</button>'+button('إلغاء','closeDialog')+'</p>',()=>{const text=el('submission').value.trim();if(!text)throw new Error('اكتب إجابتك أولاً.');repository.save('assignments',{...a,submissions:{...(a.submissions||{}),u1:text}});el('dialog').close();render();notify('تم حفظ التسليم التجريبي');});},
  submissions:id=>{const a=repository.get('assignments',id),students=repository.list('students').filter(s=>assignmentSubmission(a,s.id));showDialog('تسليمات '+a.name,(students.length?students.map(s=>'<h3>'+esc(s.name)+'</h3><p>'+esc(assignmentSubmission(a,s.id))+'</p>').join(''):'<p>لا توجد تسليمات محلية لهذا الواجب.</p>')+button('إغلاق','closeDialog'));},
  readNotification:id=>{const n=repository.get('notifications',id);repository.save('notifications',{...n,status:'مقروء'});render();notify('تم تحديث الإشعار');},
  addQuestion:()=>{const container=el('questionEditors');if(container.children.length>=20)return;container.insertAdjacentHTML('beforeend',optionFields(null,container.children.length));},
  removeQuestion:(_,target)=>{const container=el('questionEditors');const values=[...container.children].map((node,i)=>readQuestion(node,i));values.splice([...container.children].indexOf(target.closest('fieldset')),1);container.innerHTML=values.map((q,i)=>optionFields(q,i)).join('');}
};
document.addEventListener('click',event=>{
  const route=event.target.closest('[data-page]');if(route)return go(route.dataset.page);
  const target=event.target.closest('[data-action]');if(!target||target.disabled)return;
  try{const result=actions[target.dataset.action]?.(target.dataset.id,target);if(result?.catch)result.catch(error=>notify(error.message));}catch(error){if(el('dialog').open)el('dialogError').textContent=error.message;else notify(error.message);}
});
document.addEventListener('submit',event=>{
  event.preventDefault();
  try{
    if(event.target.id==='dialogForm'){dialogSubmit?.();return;}
    if(event.target.id==='accountForm'){const name=el('accountName').value.trim();if(name.length<2){el('accountError').textContent='اكتب اسماً مستعاراً من حرفين على الأقل.';return;}repository.setSetting('alias-'+state.role,name);enter();}
    if(event.target.id==='profileForm'){const name=el('profileName').value.trim();if(name.length<2)throw new Error('اكتب اسماً من حرفين على الأقل.');repository.setSetting('alias-'+state.role,name);notify('تم حفظ الاسم التجريبي');}
    if(event.target.id==='messageForm'){const text=el('msg').value.trim();if(!text)throw new Error('اكتب الرسالة أولاً.');repository.save('messages',{name:repository.getSetting('alias-'+state.role,'مستخدم تجريبي'),detail:text,role:state.role,status:'مرسل'});render();notify('تمت إضافة الرسالة محلياً؛ لم تُرسل إلى أحد.');}
  }catch(error){if(el('dialog').open)el('dialogError').textContent=error.message;else notify(error.message);}
});
document.addEventListener('input',event=>{
  if(event.target.id==='search'){state.search=event.target.value;el('resultsList').innerHTML=recordList(pageKind());}
  if(event.target.id==='volume')el('lessonVideo').volume=Number(event.target.value);
});
document.addEventListener('change',event=>{
  const target=event.target;
  try{
    if(target.id==='role'){state.role=target.value;repository.setSetting('role',state.role);go('home');repository.setSetting('entered',true);}
    if(target.id==='filterStatus'||target.id==='subjectFilter'){state[target.id==='filterStatus'?'filter':'subject']=target.value;el('resultsList').innerHTML=recordList(pageKind());}
    if(target.id==='childSelect'){repository.setSetting('selectedChild',target.value);render();}
    if(target.id==='lessonSelect'){state.lessonId=target.value;repository.setSetting('lessonId',target.value);render();}
    if(target.id==='speed')el('lessonVideo').playbackRate=Number(target.value);
    if(target.id==='videoFile'){
      const file=target.files?.[0];if(!file)return;
      if(!file.type.startsWith('video/')||file.size>250*1024*1024){notify('اختر ملف فيديو صالحاً حتى 250 ميغابايت.');target.value='';return;}
      const old=videoFiles.get(state.lessonId);if(old)URL.revokeObjectURL(old.url);
      const entry={url:URL.createObjectURL(file)};videoFiles.set(state.lessonId,entry);el('mediaStatus').textContent='جارٍ تحميل الفيديو المحلي…';el('lessonVideo').src=entry.url;el('lessonVideo').playbackRate=Number(el('speed').value);
    }
    if(target.name==='answer'){const a=repository.getAttempt(state.examId),exam=repository.get('exams',state.examId);if(a.status==='active')repository.saveAttempt(state.examId,{answers:{...a.answers,[exam.questions[a.current].id]:Number(target.value)}});else render();}
    if(target.id==='markReview'){const a=repository.getAttempt(state.examId),q=repository.get('exams',state.examId).questions[a.current];repository.saveAttempt(state.examId,{review:target.checked?[...a.review,q.id]:a.review.filter(id=>id!==q.id)});}
    storageNotice();
  }catch(error){notify(error.message);}
});
el('dialog').addEventListener('close',()=>{dialogSubmit=null;if(dialogTrigger?.isConnected)dialogTrigger.focus();else el('main').focus();});
el('theme').addEventListener('click',()=>{document.body.classList.toggle('dark');const dark=document.body.classList.contains('dark');el('theme').setAttribute('aria-pressed',String(dark));repository.setSetting('theme',dark?'dark':'light');storageNotice();});
if(repository.getSetting('theme','light')==='dark'){document.body.classList.add('dark');el('theme').setAttribute('aria-pressed','true');}
window.addEventListener('beforeunload',()=>{for(const file of videoFiles.values())URL.revokeObjectURL(file.url);});
render();

</script>
</body>
</html>
