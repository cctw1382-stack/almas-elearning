name: Built web and offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/web --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build:web
      - run: npm run test:web:unit
      - run: npm run test:web:e2e
      - run: npm run test:web:pwa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: built-web-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
